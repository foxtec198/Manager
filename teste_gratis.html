<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubbix - Teste Grátis</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="src/img/newFav.png">
    <link rel="stylesheet" href="src/css/testegratis.css">
</head>
<body data-bs-theme="dark">
    <div class="d-flex justify-contente-center" style="width: 100%; height: 100%; flex-wrap: wrap;">
        <div style="width: 100%; height: 100; flex-grow: 1; flex-basis: 50%;" class="d-flex align-items-center justify-content-center">
            <img src="src/img/hand.gif" width="300vh">
        </div>    
        <div class="d-flex flex-column p-4 h-100justify-content-center" style="width: 100%; height: 100%; background-color: #fff; color: #333; flex-grow: 1; flex-basis: 50%; overflow: auto;">
            <p class="fs-3">
                <i class="bi bi-building-lock"></i>
                Vamos cadastrar sua empresa?
            </p>
            <p class="fs-6">Os dados abaixo serão protegidos e criptografados, cuidamos da imagem da sua empresa!</p>
            <form action="/cadastrar_empresa/" method="post">
                <div class="">
                    <div class="mb-3 row g-3">
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">Nome da Loja</label>
                            <input name="nomeLoja" type="text" class="form-control" id="exampleFormControlInput1" placeholder="Nome da Loja" autocomplete="organization" required>
                        </div>
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">CNPJ ou CPF</label>
                            <input type="number" class="form-control" id="exampleFormControlInput1" placeholder="12345678910" name="cnpj" required>
                        </div>
                    </div>
                    <div class="mb-3 row g-3">
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">Email<label for=""></label></label>
                            <input name="email" type="text" class="form-control" id="exampleFormControlInput1" placeholder="Seu email aqui!" autocomplete="email" required>
                        </div>
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">Telefone<label for=""></label></label>
                            <input name="telefone" type="tel" class="form-control" placeholder="Seu telefone aqui" id="exampleFormControlInput1" autocomplete="tel" required>
                        </div>
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">Nome do Responsável<label for=""></label></label>
                            <input name="nome" type="text" class="form-control" id="exampleFormControlInput1" placeholder="Seu nome!" autocomplete="name" required>
                        </div>
                    </div>
                    <div class="mb-3 row g-3">
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">CEP</label>
                            <input name="cep" type="text" class="form-control" placeholder="Codigo Postal" aria-label="First name" autocomplete="postal-code" required>
                        </div>
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">Rua, Numero</label>
                            <input name="rua" type="text" class="form-control" placeholder="Logradouro" aria-label="Logradouro" autocomplete="street-address" required>
                        </div>
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">Bairro</label>
                            <input name="bairro" type="text" class="form-control" placeholder="Alogoinhas..." aria-label="Logradouro" autocomplete="address-level3" required>
                        </div>
                    </div>
                    <div class="mb-3 row g-3">
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">UF</label>
                            <input name="estado" type="text" class="form-control" placeholder="PR, MG, SP..." aria-label="Bairro" autocomplete="address-level1" required>
                        </div>
                        <div class="col">
                            <label for="exampleFormControlInput1" class="form-label">Cidade</label>
                            <input name="cidade" type="text" class="form-control" placeholder="Cidade" aria-label="Last name" autocomplete="address-level2" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Escolha o sistema!</label>
                        <select name="sistema" class="form-select" aria-label="Default select example" required>
                            <option selected>Gourmet</option>
                            <option>Manager</option>
                        </select>
                        <br>
                        <a href="https://www.youtube.com/watch?v=BqCTrL1KVkk&ab_channel=Hubbix-Sistemas" style="color: #000;"><i class="bi bi-link"></i> Caso não saiba qual sistema escolher, veja este video!</a>
                    </div>
                    <br>
                    <button type="submit" class="btn btn-outline-dark align-self-end">Cadastrar Loja</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
