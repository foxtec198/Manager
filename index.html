<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- INIT META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- END META -->
    <title>Login Manager</title>
    <!-- INIT CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="assets/img/fav.png">
    <link rel="manifest" href="assets/js/manifest.json">
    <link rel="stylesheet" href="assets/css/base.css">
    <!-- END CSS -->
</head>
<body data-bs-theme="dark" id="imgCont">
    <!-- INIT NAV -->
    <nav class="d-flex p-2 gap-2 justify-content-between align-items-center">
        <a href="/"><img src="assets/img/logo.svg" height="30vh"></a>
    </nav>
    <!-- END NAV -->

    <!-- INIT CONTENT -->
    <div class="d-flex justify-content-center align-items-center h-100">
        <!-- INIT FORM LOGIN -->
        <form class="form" id="form_login">
            <!-- INIT INPUT MAT -->
            <span class="input-span">
                <label for="email" class="label">Matrícula</label>
                <input type="number" name="matricula" id="mat" required autofocus/>
            </span>
            <!-- END INPUT MAT -->

            <!-- INIT INPUT PWD -->
            <span class="input-span">
                <label for="password" class="label">Senha</label>
                <input type="password" name="pwd" id="pwd" required/>
            </span>
            <!-- END INPUT PWD -->

            <!-- INIT LABEL FORGET PASSWORD -->
            <span class="span mb-2"><a href="#">Esqueceu a senha?</a></span>
            <!-- END LABEL FORGET PASSWORD -->
             
            <!-- INIT INPUT BUTTON -->
            <input class="submit" type="submit" value="Entrar"/>
            <!-- END INPUT BUTTON -->

            <!-- INIT CAD SPAN -->
            <span class="span">Não tem conta? <a href="https://hubbix.com.br" target="_blank">Crie uma</a></span>
            <!-- END CAD SPAN -->
        </form>
        <!-- END FORM LOGIN -->
    </div>
    <!-- END CONTENT -->

    <!-- INIT SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/three.min.js"></script>
    <script src="assets/js/vanta.net.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/configs.js"></script>
    <script> // Animação de Fundo
        VANTA.NET({ 
            el: "#imgCont",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x55ff3f,
            backgroundColor: 0xf110f,
            points: 9.00,
            maxDistance: 19.00,
            spacing: 19.00,
        })

        document.getElementById('form_login').addEventListener("submit", function (e){
            e.preventDefault() // Evita o reload
            login(this) // Chama o login
        })
    </script>
    <!-- END SCRIPTS -->
</body>
</html>
