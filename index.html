<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="../img/newFav.png">
    <link rel="manifest" href="js/manifest.json">
    <link rel="stylesheet" href="css/base_manager.css">
</head>
<body data-bs-theme="dark">
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastHbx" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <img src="img/newFav.png" class="rounded me-2" alt="..." height="20vh">
            <strong class="me-auto">Hubbix Manager</strong>
            <small>Agora</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-body" id="toast-text"></div>
        </div>
    </div>

    <nav class="d-flex p-2 gap-2 justify-content-between align-items-center">
        <a href="/"><img src="img/logo.svg" height="30vh"></a>
    </nav>

    <div class="d-flex justify-content-center align-items-center h-100">
        <form class="form" id="form_login">
            <span class="input-span">
                <label for="email" class="label">Matrícula</label>
                <input type="number" name="matricula" id="mat" required autofocus/>
            </span>
            <span class="input-span">
                <label for="password" class="label">Senha</label>
                <input type="password" name="pwd" id="pwd" required/>
            </span>
            <!-- <span class="span"><a href="#">Esqueceu a senha?</a></span> -->
            <br>
            <input class="submit" type="submit" value="Entrar"/>
            <span class="span">Não tem conta? <a href="#">Crie uma</a></span>
        </form>

    
    </div>

    <!-- Toast -->
    <div id="snackbar"></div>
    
    <!-- Scripts -->
    <!-- Jquery --> <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>

    <!-- Chartjs --><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="../js/manager.js"></script>
    <script>
        document.getElementById('form_login').addEventListener("submit", function (e){
            e.preventDefault()

            login()  
        })

    </script>
</body>
</html>
