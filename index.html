<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="assets/img/fav.png">
    <link rel="manifest" href="assets/js/manifest.json">
    <link rel="stylesheet" href="assets/css/base.css">
</head>
<body data-bs-theme="dark" id="imgCont">
    <nav class="d-flex p-2 gap-2 justify-content-between align-items-center">
        <a href="/"><img src="assets/img/logo.svg" height="30vh"></a>
    </nav>

    <div class="d-flex justify-content-center align-items-center h-100">
        <form class="form" id="form_login">
            <span class="input-span">
                <label for="email" class="label">Matrícula</label>
                <input type="number" name="matricula" id="mat" required autofocus/>
            </span>
            <span class="input-span">
                <label for="password" class="label">Senha</label>
                <input type="password" name="pwd" id="pwd" required/>
            </span>
            <!-- <span class="span"><a href="#">Esqueceu a senha?</a></span> -->
            <br>
            <input class="submit" type="submit" value="Entrar"/>
            <span class="span">Não tem conta? <a href="https://hubbix.com.br" target="_blank">Crie uma</a></span>
        </form>
    </div>

    <!-- Jquery --> <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>

    <!-- Chartjs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/three.min.js"></script>
    <script src="assets/js/vanta.net.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="config/js/configs.js"></script>
    <script> // Animação de Fundo
        VANTA.NET({ 
            el: "#imgCont",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x55ff3f,
            backgroundColor: 0xf110f,
            points: 9.00,
            maxDistance: 19.00,
            spacing: 19.00,
        })

        document.getElementById('form_login').addEventListener("submit", function (e){
            e.preventDefault() // Evita o reload
            login(this) // Chama o login
        })
        </script>
</body>
</html>
