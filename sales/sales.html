<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" href="../img/newFav.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css" rel="stylesheet">
    <!-- Local Arch -->
    <link rel="stylesheet" href="/css/base_manager.css">
  
</head>
<body data-bs-theme="dark">    
    <!-- Modal -->
    <div class="modal fade modal-xl" id="staticBackdrop" data-bs-keyboard="true" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true"> 
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="d-flex gap-2 align-items-baseline">
                        <h1 class="modal-title fs-5" id="staticBackdropLabel">Nova Venda</h1>
                        <span class="badge badge-sm rounded-pill placeholder" id="statusCaixa">Caixa Fechado</span>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="overflow-x: auto;">
                    <div class="d-flex flex-column gap-2">
                        <div class="d-flex flex-wrap gap-2">
                            <div class="d-flex flex-column border rounded p-2" style="flex-grow: 1; flex-basis: 200px; max-height: 300px; overflow-x: auto;">
                                <label for="selProd" class="fs-6"><i class="bi bi-box-seam-fill"></i> Selecione o produto:</label>
                                <div class="input-group mb-3 p-2">
                                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
                                    <div class="form-floating">
                                        <input class="form-control" placeholder="Buscar item" id="buscaitem">
                                        <label for="buscaitem">Buscar item</label>
                                    </div>
                                </div>
                                <table class="table" id="listProd">
                                    <thead>
                                        <th>Produto</th>
                                        <th>Ação</th>
                                    </thead>
                                    <tbody id="listProdBody">
        
                                    </tbody>
                                </table>
                            </div>
                            <div class="d-flex flex-column border rounded p-2" style="flex-grow: 1; flex-basis: 200px; max-height: 300px; overflow-x: auto;">
                                <p class="fs-6"><i class="bi bi-basket-fill"></i> Carrinho:</p>
                                <ul class="list-group" id="listProdAdd"></ul>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap border rounded p-2 gap-2">
                            <div class="d-flex flex-column p-2" style="flex-grow: 1; flex-basis: 400px;">
                                <div class="form-floating">
                                    <input type="text" placeholder="Valor: R$" class="form-control money-mask" id="valorProd" disabled>
                                    <label for="valorProd">Valor: R$</label>
                                </div>
                            </div>
                            <div class="d-flex flex-column p-2" style="flex-grow: 1; flex-basis: 400px;">
                                <div class="form-floating">
                                    <input type="number" placeholder="Matricula" class="form-control" id="matricula" onblur="conferMatricula(this)">
                                    <label for="matricula">Matricula</label>
                                </div>
                            </div>
                            <div class="d-flex align-items-center">
                                <div class="d-flex flex-column p-2" style="flex-grow: 1; flex-basis: 200px;">
                                    <div class="form-floating">
                                        <input type="text" placeholder="CPF" class="form-control cpf-mask" onblur="conferCPFNewVenda(this)" id="cpf">
                                        <label for="cpf">CPF</label>
                                    </div>
                                </div>
                                <div class="spinner-border spinner-border-sm" id="ldgCPF" role="status" hidden></div>
                            </div>
                            <div class="d-flex flex-column p-2" style="flex-grow: 1; flex-basis: 200px;">
                                <div class="form-floating">
                                    <input type="text" placeholder="Desconto" class="form-control money-mask" maxlength="11" id="desconto">
                                    <label for="desconto">Desconto</label>
                                </div>
                                
                            </div>
                            <div class="d-flex flex-column p-2" style="flex-grow: 1; flex-basis: 200px;">
                                <div class="input-group mb-3">
                                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-credit-card-fill"></i></span>
                                    <div class="form-floating">
                                        <select class="form-select" aria-placeholder="Metodo de Pagamento" id="selPag">
                                            <option>Pix</option>
                                            <option>Debito</option>
                                            <option>Credito</option>
                                            <option>Dinheiro</option>
                                        </select>
                                        <label for="selPag">Metodo de Pagamento</label>
                                    </div>
                                </div>
                            </div>
                            <!-- <div class="d-flex justify-content-center align-items-center">
                                <img class="img-fluid img-thumbnail" width="200vh" src="https://api.hubbix.com.br/qrpix/1MSOFICINADOCELULAR1MSOFICINADOCELULARKEY20250603041207.png" alt="qrcodepix" id="imgqr">
                            </div> -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="button" class="btn btn-success" onclick="vender()" id="btnVender">Vender</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Corpo Vendas -->
    <div class="d-flex flex-column p-2 gap-2">
        <div class="d-flex p-2 justify-content-between align-items-center flex-wrap-reverse">
            <p style="flex-grow: 1; flex-basis: 200px;" class="fs-2 fw-bold">Vendas.</p>
            <button onclick="zerarcart()" data-bs-toggle="modal" data-bs-target="#staticBackdrop" class="btn btn-success mobile"><i class="bi bi-plus-circle-fill"></i></a>
            <button onclick="zerarcart()" data-bs-toggle="modal" data-bs-target="#staticBackdrop" class="btn btn-success btn-sm mobile-hide"><i class="bi bi-plus-circle-fill"></i> Nova Venda</a>
        </div>
    
        <div class="d-flex gap-2 flex-wrap">
            <!-- Vendas Mes -->
            <div class="sell_card azul">
                <div class="topo text-truncate">
                    <i class="bi bi-cart4"></i>
                    <p>Vendas Mês</p>
                </div>
                <p class="valor" id="vendasMes">
                    <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                </p>
            </div>

            <!-- Vendas Hoje -->
            <div class="sell_card verde-escuro">
                <div class="topo text-truncate">
                    <i class="bi bi-calendar-event-fill"></i>
                    <p>Vendas Hoje</p>
                </div>
                <p class="valor" id="vendasDia">
                    <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                </p>
            </div>

            <!-- Vendas Pix -->
            <div class="sell_card roxo">
                <div class="topo text-truncate">
                    <i class="bi bi-x-diamond-fill"></i>
                    <p>Pix</p>
                </div>
                <p class="valor" id="pix">
                    <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                </p>
            </div>

            <!-- Vendas Cartoes -->
            <div class="sell_card laranja">
                <div class="topo text-truncate">
                    <i class="bi bi-credit-card-2-front-fill"></i>
                    <p>Cartões</p>
                </div>
                <p class="valor" id="cards">
                    <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                </p>
            </div>

            <!-- Vendas Dinehiro -->
            <div class="sell_card verde">
                <div class="topo text-truncate">
                    <i class="bi bi-coin"></i>
                    <p>Dinheiro</p>
                </div>
                <p class="valor" id="dinheiro">
                    <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                </p>
            </div>
        </div>
    
        <div id="tb_vendas" class="mt-2">
            <!-- <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
                <div class="form-floating">
                    <input id="busca" type="text" class="form-control" placeholder="Buscar Venda" aria-label="Username" aria-describedby="basic-addon1">
                    <label for="busca">Buscar Venda</label>
                </div>
            </div>
            <div class="card mt-4 p-2 overflow-auto" id="divTableVendas">
                <div class="d-flex w-100 align-items-center p-5 justify-content-center">
                    <span class="spinner-border text-light" role="status"></span>
                </div>
            </div> -->
        </div>
    </div>
    
    <!-- Toast -->
    <div id="snackbar"></div>
    
    <!-- Scripts -->

    <!-- Jquery --> 
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>
    <!-- Chartjs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

    <script src="/js/manager.js"></script>
    <script> vendasPorTipo(); getSaidas(); getProds(); conferencia_de_caixa() </script>
</body>
</html>
