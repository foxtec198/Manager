<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta theme-color="#2B3035">
    <title>Hubbix Manager</title>
    <script src="../src/js/manager.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Favicon -->
    <link rel="icon" href="../src/img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../src/css/base_manager.css">
    
    <!-- Outros Modulos (JQUERY, CHARTJS) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body data-bs-theme="dark">
    <div class="p-2">
        <div class="d-flex justify-content-between align-items-center p-1 flex-wrap">
            <p class="fs-2 fw-bold" style="flex-grow: 1;"><i class="bi bi-box-seam-fill"></i> Caixa</p>
            <div class="d-flex flex-column text-end gap-1" style="flex-grow: 1;">
                <span class="fs-6 fw-bold badge rounded-pill placeholder align-self-end" id="statusCaixa">Caixa Fechado</span>
            </div>
        </div>
        <div class="d-flex justify-content-around gap-2 flex-wrap">
            <div class="d-flex flex-column gap-2" style="flex-grow: 1;">
                <div class="card p-4">
                    <p class="fs-5 fw-bold">Abrir Caixa</p>
                    <form id="formABC" action="/manager/api/v1/abrir_caixa" method="post" class="d-flex flex-column gap-1">
                        <input class="form-control" id="mattroco" oninput="conferTroco(this)" placeholder="Matricula" type="number" name="mat" required>
                        <input class="form-control" id="troco" placeholder="Troco" type="text" name="valor" required>
                        <button class="btn btn-success" id="btnAbrirCaixa" type="submit">Abrir</button>
                    </form>
                </div>
                <div class="card p-4">
                    <p class="fs-5 fw-bold">Aplicar Valor</p>
                    <form action="/manager/api/v1/aplicar_valor/" method="post" class="d-flex flex-column gap-1">
                        <input class="form-control" placeholder="Matricula" oninput="conferMatricula(this)" type="number" name="mat" required>
                        <input class="form-control" placeholder="Valor" type="text" name="valor" required>
                        <button class="btn btn-success" type="submit">Aplicar</button>
                    </form>
                </div>
                <div class="card p-4">
                    <p class="fs-5 fw-bold">Retirar Valor</p>
                    <form action="/manager/api/v1/retirar_valor/" method="post" class="d-flex flex-column gap-1">
                        <input class="form-control" placeholder="Matricula" oninput="conferMatricula(this)" type="number" name="mat" required>
                        <select class="form-select" name="motivo" onchange="motivoF(this)">
                            <option>Sangria</option>
                            <option>Outro</option>
                        </select>
                        <input class="form-control" id="motivoIn" placeholder="Outro Motivo" type="text" name="motivoDet" hidden>
                        <input class="form-control" placeholder="Valor" type="text" name="valor" required>
                        <button class="btn btn-success" type="submit">Retirar</button>
                    </form>
                </div>
            </div>
            <div class="card p-4" style="flex-grow: 1;">
                <p class="fs-5 fw-bold">Fechamento</p>
                <form action="/manager/api/v1/fechar_caixa/" method="post" class="d-flex flex-column gap-1">
                    <input class="form-control" placeholder="Matricula" oninput="conferMatricula(this)" type="number" name="mat" required>
                    <input class="form-control" value="Dinheiro: R$" type="text" id="dinheiro" disabled>
                    <input class="form-control" value="Debito: R$" type="text" id="debito" disabled>
                    <input class="form-control" value="Crédito: R$" type="text" id="credito" disabled>
                    <input class="form-control" value="Pix: R$" type="text" id="pix" disabled>
                    <input class="form-control" value="Total: R$" type="text" id="total" disabled>
                    <input class="form-control" value="Saidas: R$" type="text" id="saidas" disabled>
                    <input class="form-control" value="Abertura: R$" type="text" id="abertura" disabled>
                    <br>
                    <button class="btn btn-danger" type="submit">Fechar Caixa</button>
                </form>
            </div>
            <div class="card p-4" style="flex-grow: 1;">
                <p class="fs-5 fw-bold">Saidas <br> <span class="fs-6 fw-light">Motivo - Valor - Data</span></p>
                <ul class="list-group" id="saidasCaixa"></ul>
            </div>
        </div>
        <script>
            async function start(){
                await conferCaixa()
                await getSaidasCaixa()
                await calc()
            }
            start()
            var tst = '{{tst}}'
            if(tst){
                toast(tst)
            }
        </script>
    
    </div>
</body>
</html>
