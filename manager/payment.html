<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubbix Manager</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" href="../img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../css/base_manager.css">
</head>
<body data-bs-theme="dark">
    <div class="d-flex flex-column justify-content-center align-items-center h-100">
        <img id="qrpix" class="img-fluid img-thumbnail" width="250vh" alt="qrcodepix">
        <span id="lbl" class="fs-5">Aguardando pagamento (60)</span>
    </div>
    
    <!-- Toast -->
    <div id="snackbar"></div>

    <!-- Scripts -->
    <!-- Jquery --> <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>
    <!-- CHARTJS --> <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="../js/manager.js"></script>
    <script> 
        let query = window.location.search
        const params = new URLSearchParams(query)

        const id = params.get('id')
        const qr = params.get('qr')
        console.log(id, qr)

        let img =  document.getElementById('qrpix')
        img.src = server + '/' + qr

        async function requestl(url, method='GET', delayMs = 1000) {
            let resposta;
            let tentativas = 0;
            let segundos = 60
            let lbl = document.getElementById('lbl')
            
            while (true) {
                if(segundos > 0){
                    try {
                        resposta = await fetch(api + url, {method: method});
    
                        if (resposta.status === 200) {
                            console.log("✅ Pagamento Aprovado, Redirecionando!");
                            lbl.textContent = "✅ Pagamento Aprovado, Redirecionando!";
                            const dados = await resposta.json(); // ou .text() se não for JSON
                            setTimeout(function(){
                                window.top.location = '/manager/base.html'
                            }, 3000)
                            return dados;
                        } else {
                            console.warn(`⚠️ Tentativa ${++tentativas}: status ${resposta.status}`);
                            lbl.textContent = `Aguardando pagamento (${--segundos})`
                        }
                    } catch (erro) {
                        console.error(`❌ Erro na requisição:`, erro);
                    }
    
                    // Aguarda um pouco antes da próxima tentativa
                    await new Promise(resolve => setTimeout(resolve, delayMs));
                }else{
                    console.log('Sessão expirada!')
                    return
                }
            }
        }

        requestl(`pagamento?id=${id}`)
    </script>
</body>
</html>
