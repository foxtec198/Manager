<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Favicon -->
    <link rel="icon" href="../img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../css/base_manager.css">
</head>
<body data-bs-theme="dark">
    <div class="d-flex flex-column h-100 justify-content-between p-4">
        <span id="stcx" class="display-6 mb-2 text-center rounded fw-bold"></span>
        <div class="d-flex mb-2 gap-2 flex-grow-1">
            <img class="img-fluid object-fit-contain p-2 flex-grow-1 bd-green" alt="logo" width="100vh" id="logoBase">
            <div class="d-flex justify-content-between gap-2 flex-column flex-grow-1">
                <div class="card bd-green">
                    <div class="card-header">Codigo de Barras.</div>
                    <div class="card-body p-4 text-center fs-5 fw-bold" id="cxcdgbar"></div>
                </div>
                <div class="card bd-green">
                    <div class="card-header">Valor Unitário.</div>
                    <div class="card-body p-4 text-center fs-5 fw-bold" id="cxvlr"></div>
                </div>
                <div class="card bd-green">
                    <div class="card-header">Total do item.</div>
                    <div class="card-body p-4 text-center fs-5 fw-bold" id="cxttitem">
                    </div>
                </div>
            </div>
            <div class="card d-flex bd-violet flex-grow-1 p-2">
                <div class="card-header text-center">
                    <span class="fw-bold fs-5">Lista de Produtos.</span>
                </div>
                <div class="card-body overflow-auto">
                    <table class="table" id="listProd">
                        <thead>
                            <th>N° Item</th>
                            <th>Código</th>
                            <th>Descrição</th>
                            <th>Qntd.</th>
                            <th>Vlr Unit.</th>
                            <th>Total</th>
                        </thead>
                        <tbody id="listProdBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="d-flex mb-2 gap-2">
            <div class="card flex-grow-1 bd-violet">
                <div class="card-header">Codigo</div>
                <div class="card-body p-2 text-center fs-5 fw-bold" id="cxcdg"></div>
            </div>
            <div class="card flex-grow-1 bd-blue">
                <div class="card-header">Subtotal</div>
                <div class="card-body p-2 text-center fs-5 fw-bold"></div>
            </div>
            <div class="card flex-grow-1 bd-green2">
                <div class="card-header">Total Recebido</div>
                <div class="card-body p-2 text-center fs-5 fw-bold">
                    R$ 0
                </div>
            </div>
            <div class="card flex-grow-1 bd-brow">
                <div class="card-header">Troco</div>
                <div class="card-body p-2 text-center fs-5 fw-bold">
                    R$ 0
                </div>
            </div>
        </div>
        <div class="form-floating">
            <input type="text" id="ean" class="form-control" placeholder="EAN/SKU" autofocus>
            <label for="ean">EAN/SKU</label>
        </div>
    </div>

    <!-- Toast -->
    <div id="snackbar"></div>

    <!-- Scripts -->
    
    <!-- Jquery --> <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>
    <!-- Chartjs --><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="../js/manager.js"></script>
    <script>
        md_conferencia_cx();
        md_get_loja();

        document.getElementById('ean').addEventListener("input", () => {
            clearTimeout(timeout);
            timeout = setTimeout(()=>{
                md_add_prod(document.getElementById('ean'))
            }, 500)
        })
    </script>
</body>
</html>
