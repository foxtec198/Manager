<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta theme-color="#2B3035">
    <title>Hubbix Manager</title>
    <script src="../src/js/manager.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Favicon -->
    <link rel="icon" href="../src/img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../src/css/base_manager.css">
    
    <!-- Outros Modulos (JQUERY, CHARTJS) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body data-bs-theme="dark">
  <div class="p-2">
      <div class="d-flex flex-row justify-content-between align-items-center">
          <p class="fs-2 fw-bold">Ordens de Seviços</p>
          <div>
        <button class="btn btn-success mobile"><i class="bi bi-folder-plus"></i></button>
        <button class="btn btn-success btn-sm mobile-hide"><i class="bi bi-folder-plus"></i> Nova OS</button>
          </div>
      </div>
  
      <div class="d-flex p-2 gap-2 flex-wrap">
          <div class="d-flex flex-column p-2 border rounded bg-blue metric" style="flex-grow: 1; flex-basis: 10px;">
              <div class="d-flex gap-1">
                  <i class="bi bi-box-arrow-up-right"></i>
                  <p>Abertas</p>
              </div>
              <p class="fs-4 fw-bold text-center" id="abertas">0</p>
          </div>
          <div class="d-flex flex-column p-2 border rounded text-bg-danger metric" style="flex-grow: 1; flex-basis: 10px;">
              <div class="d-flex gap-1">
                  <i class="bi bi-trash-fill"></i>
                  <p>Canceladas</p>
              </div>
              <p class="fs-4 fw-bold text-center" id="canceladas">0</p>
          </div>
          <div class="d-flex flex-column p-2 border rounded bg-violet metric" style="flex-grow: 1; flex-basis: 10px;">
              <div class="d-flex gap-1">
                  <i class="bi bi-bell-slash-fill"></i>
                  <p>Sem Conserto</p>
              </div>
              <p class="fs-4 fw-bold text-center" id="semconserto">0</p>
          </div>
          <div class="d-flex flex-column p-2 border rounded bg-orange metric" style="flex-grow: 1; flex-basis: 10px;">
              <div class="d-flex gap-1">
                  <i class="bi bi-chat-left-quote-fill"></i>
                  <p>Finalizadas</p>
              </div>
              <p class="fs-4 fw-bold text-center" id="finalizadas">0</p>
          </div>
          <div class="d-flex flex-column p-2 border rounded bg-green metric" style="flex-grow: 1; flex-basis: 10px;">
              <div class="d-flex gap-1">
                  <i class="bi bi-patch-check"></i>
                  <p>Entregues</p>
              </div>
              <p class="fs-4 fw-bold text-center" id="entregues">0</p>
          </div>
      </div>
  
      <div class="accordion p-2" id="accordionExample">
          <!-- Abir OS -->
          <div class="accordion-item overflow-hidden">
            <h2 class="accordion-header">
              <button class="accordion-button text-bg-dark collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                Ordens Abertas
              </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
              <div class="accordion-body">
          <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
            <input class="form-control" placeholder="Buscar OS" id="buscarAbertas">
          </div>
          <div class="overflow-auto">
            <table class="table" id="tbAbertas">
              <thead>
              <th>OS</th>
              <th>Cliente</th>
              <th>Dispositivo</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Atendente</th>
              <th>Entrega</th>
              <th>Cadastro</th>
              <th>Ação</th>
              </thead>
              <tbody id="tbAbertas">
      
              </tbody>
            </table>
          </div>
              </div>
            </div>
          </div>
  
          <!-- Todas OS -->
          <div class="accordion-item overflow-hidden">
            <h2 class="accordion-header">
              <button class="accordion-button text-bg-dark collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                Todas as Ordens
              </button>
            </h2>
            <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
          <div class="accordion-body overflow-auto">
          <div class="input-group mb-3">
            <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
            <input class="form-control" placeholder="Buscar OS" id="buscaAll">
          </div>
          <div class="overflow-auto">
            <table class="table" id="tbAll">
              <thead>
                <th>OS</th>
                <th>Cliente</th>
                <th>Dispositivo</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Atendente</th>
                <th>Entrega</th>
                <th>Cadastro</th>
                <th>Ação</th>
              </thead>
              <tbody id="tbAll2"></tbody>
            </table>
          </div>
              </div>
            </div>
          </div>
      </div>
  
      <script>
      $(document).ready(function(){
          $("#buscarAbertas").on("keyup", function() {
              var value = $(this).val().toLowerCase();
              $("#tbAbertas tr").filter(function() {
              $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
              });
          });
          });
  
      $(document).ready(function(){
          $("#buscaAll").on("keyup", function() {
              var value = $(this).val().toLowerCase();
              $("#tbAll tr").filter(function() {
              $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
              });
          });
          });
  
      async function start(){
        await getStatusOs()
        await getOsAbertas()
        await getAllOs()
      }
      start()
      </script>
  </div>
</body>
</html>
