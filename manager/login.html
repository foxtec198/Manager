<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="icon" href="../src/img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../src/css/base_manager.css">
</head>
<body data-bs-theme="dark">
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastHbx" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <img src="../src/img/newFav.png" class="rounded me-2" alt="..." height="20vh">
            <strong class="me-auto">Hubbix Manager</strong>
            <small>Agora</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-body" id="toast-text"></div>
        </div>
    </div>

    <nav class="d-flex p-2 gap-2 justify-content-between align-items-center">
        <a href="/"><img src="../src/img/logo.svg" class="logo"></a>
    </nav>
    <script src="../src/js/manager.js"></script>
    <div class="d-flex justify-content-center align-items-center h-100">
        <div class="card">
            <form>
                <div class="card-header">
                    <p class="fs-5 fw-bold text-center">Realizar Login</p>
                </div>
                <div class="card-body d-flex flex-column gap-2">
                    <input id="mat" type="number" placeholder="Matricula" class="form-control" required>
                    <input id="pwd" type="password" placeholder="Senha" class="form-control" autocomplete="current-password" required>
                </div>
                <div class="card-footer d-flex flex-column gap-2">
                    <div class="alert alert-warning" role="alert" id="msgAlert" hidden></div>
                    <button type="button" class="btn btn-success w-100" onclick="logar()"><i class="bi bi-toggle-on"></i> Login</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        function logar(){
            var m = document.getElementById('mat')
            var p = document.getElementById('pwd')

            if(m.value && p.value){
                ldg()
                request(`/manager/api/v1/login/?mat=${m.value}&pw=${p.value}`, 'POST')
                .then(res=>{
                    res.json()
                    .then(js=>{
                        if(res.ok && parseInt(js[0]) == parseInt(m.value)){
                            const cr = js[2]
                            const gc = js[1]

                            localStorage.setItem('cr', cr)
                            localStorage.setItem('gc', gc)
                            window.location = '/manager/base.html'
                        }else if(res.status === 401){
                            toast(js)
                            closeLdg()
                        }
                    })
                })
            }else{
                if(!m.value){
                    toast('Matricula Vazia')
                }else if(!p.value){
                    toast('Senha Vazia')
                }
            }
        }
    </script>
</body>
</html>
