<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta theme-color="#2B3035">
    <title>Hubbix Manager</title>
    <script src="../js/manager.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    

    <!-- Favicon -->
    <link rel="icon" href="../img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../css/base_manager.css">
    
    <!-- Outros Modulos (JQUERY, CHARTJS) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body data-bs-theme="dark">
    <div class="p-2">
        <h1 class="">Configurações.</h1>
        <hr>
        <div class="d-flex flex-column p-4">
            <div class="d-flex justify-content-between mb-3 flex-wrap gap-4">
                <span class="fs-5 fw-bold w-50">Fuso horário</span>
                <select class="form-control w-50" onchange="trocar_fuso(this)" id="slFuso" style="flex-grow: 1; flex-basis: 200px;"> 
                    <option value="-2">GMT -2</option>
                    <option value="-3">GMT -3</option>
                    <option value="-4">GMT -4</option>
                    <option value="-5">GMT -5</option>
                </select>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-3 flex-wrap gap-4">
                <span class="fs-5 fw-bold w-50" style="flex-grow: 1; flex-basis: 200px;">Controle Estoque</span>
                <div class="d-flex justify-content-end" style="flex-grow: 1; flex-basis: 200px;">
                    <label class="switch">
                        <input class="toggle" type="checkbox" id="ckEstoque" onchange="alterar_estoque(this)">
                        <span class="slider"></span>
                        <span class="card-side"></span>
                    </label>
                </div>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-3 flex-wrap gap-4">
                <span class="fs-5 fw-bold w-50" style="flex-grow: 1; flex-basis: 200px;">Controle de Peças</span>
                <div class="d-flex justify-content-end" style="flex-grow: 1; flex-basis: 200px;">
                    <label class="switch">
                        <input class="toggle" type="checkbox" id="ckPeca" onchange="alterar_pecas(this)">
                        <span class="slider"></span>
                        <span class="card-side"></span>
                    </label>
                </div>
            </div>
            <hr>
            <div class="d-flex align-items-top justify-content-between flex-wrap gap-4">
                <span class="fs-5 fw-bold" style="flex-grow: 1; flex-basis: 200px;">Escala da Logo</span>
                <div class="d-flex flex-column gap-1 align-items-end" style="flex-grow: 1; flex-basis: 200px;">
                    <div class="d-flex gap-2">
                        <img class="img-fluid img-thumbnail" alt="Logo" width="130wh" id="config_logo">
                        <form action="http://localhost:5432/manager/api/v1/atualizar_logo/" method="post" enctype="multipart/form-data" class="d-flex flex-column gap-2 justify-content-around">
                            <input type="text" name="cr" id="inputCR" hidden>
                            <input type="file" name="logoImg" class="form-control" accept="image/*">
                            <button class="btn btn-success" >Alterar Imagem</button>
                            <div class="d-flex gap-2 justify-content-around align-items-center">
                                <span class="fs-6 fw-bold">Escala: </span>
                                <select class="form-control" onchange="trocar_escala(this)" id="slEscala"></select>
                            </div>
                        </form>
                    </div>
                    <span class="text-end" style="font-size: 12px; font-style: italic;">
                        Só altere a escala da logo, caso esteja consumindo muito espaço na Ordem de Serviço.
                        <br>
                        Quanto maior a escala, menor a logo!
                    </span>
                </div>
            </div>
            <hr>
            <div class="d-flex align-items-top justify-content-between flex-wrap gap-4" style="max-height: 500px; overflow-y: auto;">
                <span class="fs-5 fw-bold" style="flex-grow: 1; flex-basis: 200px;">Controle de Funcionários</span>
                <div class="d-flex flex-column w-100 gap-2" style="flex-grow: 1; flex-basis: 200px;">
                    <div class="input-group" id="nweFunc">
                        <input type="text" id="nomeFunc" class="form-control w-75" placeholder="Nome do Funcionario(a)">
                        <button onclick="newFunc(this)" class="form-control w-25">Adicionar</button>
                    </div>
                    <ul class="list-group" id="listFuncs"></ul>
                </div>
            </div>
            <hr>
        </div>
    </div>
    <script>
        get_config()
    </script>
</body>
</html>
