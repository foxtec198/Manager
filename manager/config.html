<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta theme-color="#2B3035">
    <title>Hubbix Manager</title>
    <script src="../src/js/manager.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Favicon -->
    <link rel="icon" href="../src/img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../src/css/base_manager.css">
    
    <!-- Outros Modulos (JQUERY, CHARTJS) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body data-bs-theme="dark">
    <div class="p-2">
        <h1 class="">Configurações</h1>
        <hr>
        <div class="d-flex flex-column p-4">
            <div class="d-flex justify-content-between mb-3">
                <span class="fs-5 w-50">Fuso horário</span>
                <select class="form-control w-50" onchange="trocar_fuso(this)">
                    <option value="-2">GMT -2</option>
                    <option value="-3">GMT -3</option>
                    <option value="-4">GMT -4</option>
                    <option value="-5">GMT -5</option>
                </select>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-3">
                <span class="fs-5 w-50">Controlar Estoque Negativo</span>
                <div class="form-check form-switch ">
                    <input class="form-check-input" type="checkbox" onchange="estoque_negativo(this)" role="switch" id="flexSwitchCheckDefault">
                </div>
            </div>
            <hr>
        </div>
    </div>
</body>
</html>
