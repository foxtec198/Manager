<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" href="../img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../css/base_manager.css">

    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>

    </style>
</head>
<body data-bs-theme="dark">
    <span class="fs-1 p-2 fw-bold">Relatórios.</span>

    <!-- Filtros -->
    <div class="d-flex flex-column p-2" style="overflow-x: auto;">
        <div class="d-flex p-2 gap-2 align-items-center">
            <i class="bi bi-filter-circle-fill"></i>
            <span class="fw-bold">Filtros: </span>
        </div>
        <div class="btn-group">
            <button class="btn btn-outline-success" id="btn-ontem" value="ontem" onclick="trocarFiltroRes(this)">Ontem</button>
            <button class="btn btn-success" id="btn-hoje" value="hoje" onclick="trocarFiltroRes(this)">Hoje</button>
            <button class="btn btn-outline-success" id="btn-mes" value="mes" onclick="trocarFiltroRes(this)">Mês</button>
            <button class="btn btn-outline-success" id="btn-ano" value="ano" onclick="trocarFiltroRes(this)">Ano</button>
            <input class="btn btn-outline-success" type="date" placeholder="Personalizado" onchange="trocarFiltroRes(this)" id="btn-data">
        </div>
        <div class="d-flex p-2 gap-2 align-items-center">
            <i class="bi bi-calendar-check"></i>
            <span class="fw-bold">Periodo: </span>
        </div>
        <div class="d-flex btn-group justify-content-center align-items-center">
            <input class="btn btn-outline-success w-100" type="text" value="Periodo" id="btn-periodo">
            <button class="btn btn-success input-group-text" id="btnPeriodo" onclick="trocarFiltroRes(document.getElementById('btn-periodo'))">Filtrar</button>
        </div>
    </div>
    <hr>

    <!-- Results Cards -->
    <div class="d-flex flex-column p-2 gap-3">
        <div class="d-flex flex-wrap gap-2 justify-content-around">
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Total.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="total_vendas">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </span>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Ordem de Serviço.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="vendas_os">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </span>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Produtos.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="vendas_prod">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span> 
                    </span>
                </div>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-around">
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Bruto.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="vendas_bruto">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </span>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Liquido.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="vendas_liq">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </span>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Média de Vendas.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="vendas_med">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span> 
                    </span>
                </div>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-around">
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Ticket Médio.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="tc_med">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </span>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Ticket por Cupom.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="tc_cp">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </span>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 160px;">
                <div class="card-header">
                    <span>Custo de Produtos.</span>
                </div>
                <div class="card-body">
                    <span class="fs-4 fw-bold" id="ct_prod">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </span>
                </div>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-around">
            <div class="card" style="flex-grow: 1; flex-basis: 400px;">
                <div class="card-header">
                    <span>Gráfico de Produtos.</span>
                </div>
                <div class="card-body">
                    <div id="divDashVendas" class="d-flex align-items-center justify-content-center">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </div>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 400px;">
                <div class="card-header">
                    <span>Gráfico de Ordens</span>
                </div>
                <div class="card-body">
                    <div id="divDashOs" class="d-flex align-items-center justify-content-center">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </div>
                </div>  
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 200px;">
                <div class="card-header">
                    <span>Venda por Pagamento.</span>
                </div>
                <div class="card-body">
                    <div id="divDashVendasPorTipo" class="d-flex align-items-center justify-content-center">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-around">
            <div class="card" style="flex-grow: 1; flex-basis: 200px;">
                <div class="card-header">
                    <span>Top 3 Funcionários</span>
                </div>
                <div class="card-body">
                    <ul class="list-group" id="top3func">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </ul>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 200px;">
                <div class="card-header">
                    <span>Top 3 Produtos.</span>
                </div>
                <div class="card-body">
                    <ul class="list-group" id="top3prod">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </ul>
                </div>
            </div>
            <div class="card" style="flex-grow: 1; flex-basis: 200px;">
                <div class="card-header">
                    <span>Top 3 Consertos por Marcas.</span>
                </div>
                <div class="card-body">
                    <ul class="list-group" id="top3marcas">
                        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div id="snackbar"></div>

    <!-- Scripts -->
     
    <!-- Jquery --> <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>
    <!-- Chartjs --> <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

    <script src="../js/manager.js"></script>
    <script>
        get_infos()
        flatpickr("#btn-periodo", {
            mode: "range",
            dateFormat: "d/m/Y",
            locale: "pt"
        });
    </script>
</body>
</html>
