<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Futurista Pro</title>
  <link href="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.252.0/icons.css">
  <style>
    body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0b0b0d;
  color: white;
  display: flex;
}

.sidebar {
  width: 250px;
  height: 100vh;
  background: #121418;
  border-right: 1px solid #1f1f1f;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1.5rem 1rem;
  box-shadow: 0 0 12px rgba(0, 255, 128, 0.05);
}

.brand {
  text-align: center;
}

.logo-container img {
  width: 64px;
  height: 64px;
  filter: drop-shadow(0 0 4px #2ecc71aa);
}

.brand h1 {
  font-size: 1rem;
  color: #2ecc71;
  margin-top: 0.5rem;
  text-transform: uppercase;
  text-shadow: 0 0 6px #2ecc71aa;
}

.nav, .nav-bottom {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 0.65rem 1rem;
  text-decoration: none;
  color: #c4c4c4;
  border-radius: 10px;
  transition: all 0.3s ease;
  position: relative;
  background: transparent;
}

.nav-link i {
  width: 20px;
  height: 20px;
  transition: transform 0.3s ease;
}

.nav-link:hover {
  background: rgba(46, 204, 113, 0.08);
  color: #2ecc71;
  transform: translateX(5px);
  box-shadow: inset 0 0 0 1px #2ecc71aa, 0 0 6px #2ecc7190;
}

.nav-link:hover i {
  transform: scale(1.2);
}

.nav-link.active {
  background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
  color: #0e0e11;
  font-weight: bold;
  box-shadow: 0 0 10px #2ecc71aa;
}

.nav-link.active i {
  color: #0e0e11;
}

.nav-bottom {
  padding-top: 1rem;
  border-top: 1px solid #2ecc7111;
}

/* Responsivo */
@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    height: auto;
    flex-direction: row;
    overflow-x: auto;
    padding: 0.5rem;
    justify-content: start;
  }

  .nav, .nav-bottom {
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 1rem;
  }

  .brand {
    display: none;
  }

  .nav-link {
    flex-direction: column;
    font-size: 0.75rem;
    padding: 0.4rem;
  }

  .nav-link i {
    width: 18px;
    height: 18px;
  }
}

  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-container">
        <img src="https://cdn-icons-png.flaticon.com/512/1042/1042393.png" alt="Logo" />
      </div>
      <h1>Oficina do Celular</h1>
    </div>

    <nav class="nav">
      <a class="nav-link active" href="#">
        <i class="lucide lucide-package"></i>
        <span>Caixa</span>
      </a>
      <a class="nav-link" href="#">
        <i class="lucide lucide-line-chart"></i>
        <span>Vendas</span>
      </a>
      <a class="nav-link" href="#">
        <i class="lucide lucide-receipt"></i>
        <span>OS's</span>
      </a>
      <a class="nav-link" href="#">
        <i class="lucide lucide-users"></i>
        <span>Clientes</span>
      </a>
      <a class="nav-link" href="#">
        <i class="lucide lucide-box"></i>
        <span>Estoque</span>
      </a>
      <a class="nav-link" href="#">
        <i class="lucide lucide-pie-chart"></i>
        <span>Relatórios</span>
      </a>
    </nav>

    <div class="nav-bottom">
      <a class="nav-link" href="#">
        <i class="lucide lucide-settings"></i>
        <span>Configurações</span>
      </a>
      <a class="nav-link" href="#">
        <i class="lucide lucide-log-out"></i>
        <span>Sair</span>
      </a>
    </div>
  </aside>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
