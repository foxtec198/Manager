<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubbix Manager</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" href="../img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../css/base_manager.css">
</head>
<body data-bs-theme="dark">
    <div class="d-flex h-100">
        <!-- <div class="flex-adorno mobile-hide" id="adorno">
            <img src="../img/laco.png" alt="adorno" class="adorno">
        </div> -->

        <div class="d-flex flex-column overflow-hidden mobile-hide nv" style="min-width: 180px;">
            <span class="d-flex gap-2 flex-column w-100 align-items-center justify-content-center mt-3">
                <img id="logoBase" class="logo img-fluid object-fit-contain placeholder">
                <span class="p-2 mb-5 text-center rounded-pill placeholder neon-text" id="nomeLoja" style="font-size: 13px;">,
                    Nome da Loja
                </span>
            </span>
            <button onclick="change_screen('caixa', this)" class="btnM menu-item menu-caixa"><i class="bi bi-box-seam-fill"></i> Caixa</button>
            <button onclick="change_screen('vendas', this)" class="btnM menu-item menu-vendas"><i class="bi bi-graph-up-arrow"></i> Vendas</button>
            <button onclick="change_screen('os', this)" class="btnM menu-item menu-os"><i class="bi bi-file-earmark-zip-fill"></i> OS's</button>
            <button onclick="change_screen('clientes', this)" class="btnM menu-item menu-clientes"><i class="bi bi-person-bounding-box"></i> Clientes</button>
            <button onclick="change_screen('estoque', this)" class="btnM menu-item menu-estoque"><i class="bi bi-archive-fill"></i> Estoque</button>
            <button onclick="change_screen('pecas', this)" class="btnM menu-item menu-pecas" hidden><i class="bi bi-gear-fill"></i> Peças</button>
            <button onclick="change_screen('relatorios', this)" class="btnM menu-item menu-relatorios"><i class="bi bi-microsoft"></i> Relatórios</button>
            <hr>
            <button onclick="change_screen('config', this)" class="btnM menu-item menu-config">Configurações</button>
            <button onclick="logout()" class="btnM-exit">Sair</button>
            <br>
        </div>
        <div class="d-flex flex-column w-100">
            <!-- <marquee style="margin-top: 10px;" class="d-flex gap-4" loop direction="left" id="mq"></marquee> -->
            <iframe class="p-2" src="/manager/caixa.html" id="frame_screen" width="100%" height="85%" frameborder="0"></iframe>
        </div>
    </div>

    <div class="navBot mobile">
        <div class="d-flex flex-row justify-content-around g-4">
            <a class="d-flex flex-column p-1 align-items-center navBot-item" onclick="change_screen('caixa')">
                <i class="bi bi-box-seam-fill"></i>
                <p>Caixa</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item" onclick="change_screen('vendas')">
                <i class="bi bi-graph-up-arrow"></i>
                <p>Vendas</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item" onclick="change_screen('os')">
                <i class="bi bi-file-earmark-zip-fill"></i>
                <p>Ordens</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-list"></i>
                <p>Demais</p>
            </a>
            <ul class="dropdown-menu text-bg-dark">
                <li><button onclick="change_screen('clientes')" class="dropdown-item dp-item"><i class="bi bi-person-bounding-box"></i> Clientes</a></li>
                <li><button onclick="change_screen('estoque')" class="dropdown-item dp-item"><i class="bi bi-archive-fill"></i> Estoque</a></li>
                <li hidden><button onclick="change_screen('pecas')" class="dropdown-item dp-item"><i class="bi bi-gear-fill"></i> Peças</a></li>
                <li><button onclick="change_screen('relatorios')" class="dropdown-item dp-item"><i class="bi bi-microsoft"></i> Relatórios</a></li>
                <hr>
                <li><button onclick="change_screen('config')" class="dropdown-item dp-item">Configurações</a></li>
                <li><button class="dropdown-item dp-item-exit" onclick="logout()">Sair</button></li>
            </ul>
        </div>
    </div>

    <!-- Toast -->
    <div id="snackbar"></div>

    <!-- Scripts -->
    <!-- Jquery --> <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>
    <!-- CHARTJS --> <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="../js/manager.js"></script>
    <script> 
        get_loja(); 
        restore_screen();
        if(document.getElementById("adorno")){
            datas_comemorativas('Feliz dia dos namorados! 💍💘', '12/06/2025');
        }
        if(window.innerWidth > 500){document.getElementById("frame_screen").height = "100%"}
        else{document.getElementById("frame_screen").height = "85%"}
    </script>
</body>
</html>
