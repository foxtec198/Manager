<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta theme-color="#2B3035">
    <title>Hubbix Manager</title>
    <script src="../src/js/manager.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="import" href="/manager/caixa.html">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Favicon -->
    <link rel="icon" href="../src/img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../src/css/base_manager.css">
    
    <!-- Outros Modulos (JQUERY, CHARTJS) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body data-bs-theme="dark">
    <div class="m-2 alert alert-light alert-dismissible fade show" role="alert">
        <span>
            <i class="bi bi-exclamation-triangle-fill"></i>
            Prezados, Gostariamos de informar que estamos passando por instabilidade de conexão! Porém nosso time já está trabalhando nisso, agradecemos a compreensão.
        </span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="d-flex gap-2 p-2 h-100" style="margin-bottom: 90px;">
        <div class="card overflow-hidden mobile-hide" style="min-width: 180px;">
            <span class="d-flex gap-2 flex-column w-100 align-items-center justify-content-center mt-3">
                <img id="logoBase" class="logo img-fluid object-fit-contain placeholder">
                <span class="fw-bold p-2 mb-5 text-center rounded-pill placeholder" id="nomeLoja" style="font-size: 14px;">,
                    Nome da Loja
                </span>
            </span>
            <br>
            <button onclick="changeWin('/manager/caixa.html')" class="btnM"><i class="bi bi-box-seam-fill"></i> Caixa</button>
            <button class="btnM" onclick="changeWin('/manager/vendas.html')"><i class="bi bi-graph-up-arrow"></i> Vendas</button>
            <button onclick="changeWin('/manager/os.html')" class="btnM"><i class="bi bi-file-earmark-zip-fill"></i> OS's</button>
            <button onclick="changeWin('/manager/clientes.html')" class="btnM"><i class="bi bi-person-bounding-box"></i> Clientes</button>
            <button onclick="changeWin('/manager/estoque.html')" class="btnM"><i class="bi bi-archive-fill"></i> Estoque</button>
            <button hidden onclick="changeWin('/manager/pecas.html')" class="btnM"><i class="bi bi-gear-fill"></i> Peças</button>
            <button onclick="changeWin('/manager/relatorios.html')" class="btnM"><i class="bi bi-microsoft"></i> Relatórios</button>
            <hr>
            <!-- <button onclick="changeWin('/manager/suporte')" class="btnM">Suporte</a> -->
            <button onclick="changeWin('/manager/config.html')" class="btnM">Configurações</button>
            <a href="/manager/login.html"" class="btnM-exit">Sair</a>
            <br>
        </div>
        <iframe class="card" src="/manager/caixa.html" id="changer" width="100%" height="100%" frameborder="0"></iframe>
        
        <br>
    </div>
    <br class="mobile">
    <div class="navBot mobile">
        <div class="d-flex flex-row justify-content-around g-4">
            <a class="d-flex flex-column p-1 align-items-center navBot-item" onclick="changeWin('/manager/caixa.html')">
                <i class="bi bi-box-seam-fill"></i>
                <p>Caixa</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item" onclick="changeWin('/manager/vendas.html')">
                <i class="bi bi-graph-up-arrow"></i>
                <p>Vendas</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item" onclick="changeWin('/manager/os.html')">
                <i class="bi bi-file-earmark-zip-fill"></i>
                <p>Ordens</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-list"></i>
                <p>Demais</p>
            </a>
            <ul class="dropdown-menu text-bg-dark">
                <li><button onclick="changeWin('/manager/clientes.html')" class="dropdown-item dp-item"><i class="bi bi-person-bounding-box"></i> Clientes</a></li>
                <li><button onclick="changeWin('/manager/estoque.html')" class="dropdown-item dp-item"><i class="bi bi-archive-fill"></i> Estoque</a></li>
                <li hidden><button onclick="changeWin('/manager/pecas.html')" class="dropdown-item dp-item"><i class="bi bi-gear-fill"></i> Peças</a></li>
                <li><button onclick="changeWin('/manager/relatorios.html')" class="dropdown-item dp-item"><i class="bi bi-microsoft"></i> Relatórios</a></li>
                <hr>
                <li><button onclick="changeWin('/manager/config.html')" class="dropdown-item dp-item">Configurações</a></li>
                <li><a class="dropdown-item dp-item-exit" href="/manager/login.html">Sair</a></li>
            </ul>
        </div>
    </div>
    <script> 
        getLoja() 
    </script>
</body>
</html>
