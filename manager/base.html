<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta theme-color="#2B3035">
    <title>Hubbix Manager</title>
    <script src="../src/js/manager.js"></script>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Favicon -->
    <link rel="icon" href="../src/img/newFav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../src/css/base_manager.css">
    
    <!-- Outros Modulos (JQUERY, CHARTJS) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- Jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body data-bs-theme="dark">
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastHbx" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <img src="../src/img/favicon.ico" class="rounded me-2" alt="..." height="20vh">
            <strong class="me-auto">Hubbix Manager</strong>
            <small>Agora</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-body" id="toast-text"></div>
        </div>
    </div>

    <nav class="d-flex p-2 gap-2 justify-content-between align-items-center">
        <a href="/manager/login.html"><img src="../src/img/logo.svg" class="logo"></a>
        <button class="btn mobile" data-bs-toggle="dropdown"><i class="bi bi-list"></i></button>
        <ul class="dropdown-menu text-bg-dark">
            <li><button onclick="changeWin('/manager/caixa.html')" class="dropdown-item"><i class="bi bi-box-seam-fill"></i> Caixa</a></li>
            <li><button onclick="changeWin('/manager/vendas.html')" class="dropdown-item"><i class="bi bi-graph-up-arrow"></i> Vendas</a></li>
            <li><button onclick="changeWin('/manager/os.html')" class="dropdown-item"><i class="bi bi-file-earmark-zip-fill"></i> OS's</a></li>
            <li><button onclick="changeWin('/manager/clientes.html')" class="dropdown-item"><i class="bi bi-person-bounding-box"></i> Clientes</a></li>
            <li><button onclick="changeWin('/manager/estoque.html')" class="dropdown-item"><i class="bi bi-archive-fill"></i> Estoque</a></li>
            <li><button onclick="changeWin('/manager/pecas.html')" class="dropdown-item"><i class="bi bi-gear-fill"></i> Peças</a></li>
            <li><button onclick="changeWin('/manager/relatorios.html')" class="dropdown-item"><i class="bi bi-microsoft"></i> Relatórios</a></li>
            <hr>
            <!-- <li><button onclick="changeWin('/manager/')" class="dropdown-item">Suporte</a></li> -->
            <li><button onclick="changeWin('/manager/config.html')" class="dropdown-item">Configurações</a></li>
            <li><a class="dropdown-item" href="/manager/login.html">Sair</a></li>
        </ul>
    </nav>
    <div class="d-flex gap-2 p-2 h-100">
        <div class="card overflow-hidden mobile-hide" style="min-width: 180px;">
            <br>
            <p class="fw-bold p-2 text-center rounded-pill placeholder" id="nomeLoja" style="font-size: 14px;"></p>
            <button onclick="changeWin('/manager/caixa.html')" class="btnM"><i class="bi bi-box-seam-fill"></i> Caixa</button>
            <button class="btnM" onclick="changeWin('/manager/vendas.html')"><i class="bi bi-graph-up-arrow"></i> Vendas</button>
            <button onclick="changeWin('/manager/os.html')" class="btnM"><i class="bi bi-file-earmark-zip-fill"></i> OS's</button>
            <button onclick="changeWin('/manager/clientes.html')" class="btnM"><i class="bi bi-person-bounding-box"></i> Clientes</button>
            <button onclick="changeWin('/manager/estoque.html')" class="btnM"><i class="bi bi-archive-fill"></i> Estoque</button>
            <button onclick="changeWin('/manager/pecas.html')" class="btnM"><i class="bi bi-gear-fill"></i> Peças</button>
            <button onclick="changeWin('/manager/relatorios.html')" class="btnM"><i class="bi bi-microsoft"></i> Relatórios</button>
            <hr>
            <!-- <button onclick="changeWin('/manager/suporte')" class="btnM">Suporte</a> -->
            <button onclick="changeWin('/manager/config.html')" class="btnM">Configurações</button>
            <a href="/manager/login.html"" class="btnM-exit">Sair</a>
            <br>
        </div>

        <iframe class="card" src="/manager/caixa.html" id="changer" width="100%" height="100%" frameborder="0"></iframe>
    </div>

    
    <script>
        async function getCr() {
            const res = await fetch('/manager/api/v1/get_cr/')
            const js = await res.json()
            if(js){
                document.getElementById('nomeLoja').textContent = js
            }
        }
        try{
            getCr()
        }catch{res=>
            console.log(res)
        }
    </script>
</body>
</html>
