<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- INIT CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/utils.css">
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/init_reports.css">
    <!-- END CSS-->
</head>

<body data-bs-theme="dark">
    <span class="fs-2 p-2 fw-bold" id="welcome_txt"></span>
    <div class="p-2">
        <div class="d-flex gap-2 flex-wrap">
            <!-- Person info -->
            <div class="d-flex align-items-end justify-content-end flex-grow-1 flex-basis flex-column rounded-5 shadow-lg"
                id="person">
                <div class="d-flex w-100" id="person_info">
                    <div class="d-flex flex-column">
                        <span class="fs-5 fw-bold" id="person_name">[DISPLAY NAME]</span>
                        <span id="person_perm">[PERMISSION]</span>
                    </div>
                    <span class="fs-5 fw-bold" id="person_sales">R$ 0</span>
                </div>
            </div>

            <!-- Metas X Real -->
            <div class="card d-flex flex-grow-1 flex-basis rounded-5 shadow-lg">
                <div class="card-header d-flex justify-content-between fs-5 fw-bold">
                    <span>Metas.</span>
                    <span class="badge bg-primary fs-5" id="ticket_goal">[META DE TICKET MÉDIO]</span>
                </div>

                <div class="d-flex justify-content-center align-items-center flex-column gap-4 card-body fs-5" id="div_goal">
                    <span id="spin_ldg" class="spinner-border spinner-border-lg text-light" role="status"></span>
                </div>

                <div class="card-footer">
                    <div class="d-flex justify-content-end p-2" id="goals_btns"></div>
                </div>
            </div>

            <!-- Tipos de Pagamento -->
            <div class="card flex-grow-1 flex-basis rounded-5" id="payments_report">
                <div class="card-header fs-5 fw-bold">Pagamentos.</div>
                <div class="card-body d-flex justify-content-center align-items-center" id="grafDiv">
                    <span id="spin_ldg" class="spinner-border spinner-border-lg text-light" role="status"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- INIT SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="../assets/js/utils/request.js"></script> <!-- API Request Util -->
    <script src="../assets/js/models/dashboards.js"></script> <!-- Dashboard Model -->
    <script src="../assets/js/main.js"></script> <!-- Main Code -->
    <script src="../assets/js/dashboards.js"></script> <!-- Dash Code -->
    <script>welcome(); info_person(); get_infos()</script>
    <!-- END SCRIPTS -->
</body>

</html>
