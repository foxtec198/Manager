<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- INIT CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/utils.css">
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/parts.css">
    <!-- END CSS -->
</head>
<body data-bs-theme="dark">
    <div class="p-2">
        <div class="d-flex justify-content-between align-items-center">
            <p class="fs-2 fw-bold">Peças</p>
            <div class="dropdown">
                <button class="btn btn-success btn-sm" type="button">
                    <i class="bi bi-node-plus-fill"></i> Nova Peça
                </button>
              </div>
        </div>
        <div>
            <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1"><i class="bi bi-search"></i></span>
                <input id="busca" type="text" class="form-control" placeholder="Busque por um elemento da tabela" aria-label="Username" aria-describedby="basic-addon1">
            </div>
            <div class="card table-responsive-sm p-2 overflow-auto">
                <table class="table" id="table">
                    <thead>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>Custo</th>
                        <th>Valor</th>
                        <th>Quantidade</th>
                        <th>Ação</th>
                    </thead>
                    <tbody id="tbody">
        
                    </tbody>
                </table>
            </div>
        </div>
        </div>
    </div>

    <!-- INIT SCRIPTS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <!-- END SCRIPTS -->
</body>
</html>
