<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- INIT CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/utils.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/tables.css">
    <link rel="stylesheet" href="../assets/css/pos.css">
    <!-- END CSS -->
</head>

<body data-bs-theme="dark">
    <div class="d-flex flex-column gap-4">
        <!-- Opções do Caixa -->
        <div class="d-flex justify-content-between gap-4">
            <div class="d-flex flex-column gap-4 flex-grow-1" style="flex-basis: 1050px;">
                <div class="d-flex gap-4">
                    <!-- Abertura e Fechamento de caixa -->
                    <div
                        class="d-flex text-truncate flex-column p-4 justify-content-start gap-4 card rounded-4 flex-grow-1 flex-basis-200">
                        <div class="d-flex justify-content-between">
                            <strong class="fw-bold fs-4" data-state="pos"><i class="bi bi-currency-exchange"></i> [STATE
                                NOW]</strong>
                            <span class="badge fs-5 rounded-4 placeholder" data-state="pos">[STATUS CAIXA]</span>
                        </div>
                        <form id="status_caixa">
                            <div class="d-flex gap-2 flex-wrap">
                                <div class="form-floating flex-grow-1 flex-basis-500">
                                    <input class="form-control rounded-5 px-3" placeholder="Matricula" type="number"
                                        name="mat" required>
                                    <label for="mattroco">Matricula</label>
                                </div>
                                <div class="form-floating flex-grow-1 flex-basis-500" data-state="troco">
                                    <input class="form-control rounded-5 px-3 money-mask" placeholder="Troco"
                                        type="text" name="troco" required>
                                    <label for="troco">Troco</label>
                                </div>
                            </div>
                            <button class="btn btn-lg fw-bold w-100 mt-5" name="btn" data-state="pos"
                                type="submit">[STATE BUTTON]</button>
                        </form>
                    </div>
                    <!-- Carousel Despesas e Reforço -->
                    <div class="card-carousel card p-4 rounded-4 flex-grow-1 flex-basis-200" data-index="0">
                        <span class="fs-4 fw-bold"><i class="bi bi-arrow-down-up"></i> Movimentação de caixa</span>
                        <div class="card-carousel-track h-100">
                            <!-- ENTRADAS / REFORÇO -->
                            <div class="card-view p-4">
                                <span class="fs-5 badge bg-primary">Entradas <i class="bi bi-arrow-90deg-up"></i></span>
                                <form class="d-flex flex-column gap-2 mt-5" id="form_add_value">
                                    <div class="form-floating">
                                        <input type="text" placeholder="Valor R$"
                                            class="form-control rounded-5 px-3 money-mask" name="valor" />
                                        <label for="valor">Valor R$</label>
                                    </div>
                                    <div class="form-floating">
                                        <input type="number" placeholder="Matricula" class="form-control rounded-5 px-3"
                                            name="matricula" />
                                        <label for="valor">Matricula</label>
                                    </div>
                                    <button class="btn btn-lg btn-primary" type="submit">Adicionar Reforço.</button>
                                </form>
                            </div>
                            <!-- DESPESA / SANGRIA -->
                            <div class="card-view p-4">
                                <span class="fs-5 badge bg-red">Saidas <i class="bi bi-arrow-90deg-down"></i></span>
                                <form class="d-flex flex-column gap-2 mt-5" id="form_add_expense">
                                    <div class="form-floating">
                                        <input type="text" placeholder="Valor R$"
                                            class="form-control rounded-5 px-3 money-mask" name="valor" required />
                                        <label for="valor">Valor R$</label>
                                    </div>
                                    <div class="form-floating flex-grow-1">
                                        <select class="form-control rounded-5 px-3"
                                            aria-placeholder="Selecione o motivo" name="motivo"
                                            onchange="alter_expense(this)">
                                            <option>Sangria</option>
                                            <option>Despesa</option>
                                        </select>
                                        <label for="motivo">Selecione o motivo</label>
                                    </div>
                                    <div class="form-floating flex-grow-1" hidden>
                                        <input type="text" class="form-control rounded-5 px-3"
                                            placeholder="Qual a despesa?" id="motivo_declarado" />
                                        <label for="motivo_declarado">Qual a despesa?</label>
                                    </div>
                                    <div class="form-floating">
                                        <input type="number" placeholder="Matricula" class="form-control rounded-5 px-3"
                                            name="matricula" required />
                                        <label for="valor">Matricula</label>
                                    </div>
                                    <button class="btn btn-lg btn-red" type="submit">Adicionar Saida.</button>
                                </form>
                            </div>
                        </div>
                        <div class="btn-group">
                            <button class="btn carousel-nav prev fw-bold fs-4">‹</button>
                            <button class="btn carousel-nav next fw-bold fs-4">›</button>
                        </div>
                    </div>
                </div>

                <!-- Expenses -->
                <div class="card p-4 flex-grow-1 overflow-auto">
                    <p class="fs-5 fw-bold"><i class="bi bi-back"></i> Despesas</p>
                    <div data-api="expenses"></div>
                </div>
                <!-- End Expenses -->
            </div>
            <!-- Mini Dashboard -->
            <div class="d-flex flex-column gap-4 p-4 rounded-4 card flex-grow-1 flex-basis-400">
                <div class="d-flex justify-content-between align-items-start">
                    <span class="fs-4 fw-bold flex-grow-1"><i class="bi bi-bar-chart-fill"></i> Análise
                        Financeira</span>
                    <div class="form-floating flex-shrink-1 flex-basis-500">
                        <select class="form-control rounded-5 px-3" id="filter_select"
                            aria-placeholder="Selecione um periodo" onchange="set_mini_dashboard(this.value)">
                            <option value="week">Ultimos 7 dias</option>
                            <option value="day">Hoje</option>
                            <option value="month">Este Mes</option>
                        </select>
                        <label for="filter_select">Selecione um periodo</label>
                    </div>
                </div>
                <div class="d-flex justify-content-between gap-4">
                    <div class="d-flex flex-column flex-grow-1 p-4 rounded-4 border">
                        <span class="">Venda de Produtose</span>
                        <span class="fs-1 fw-bold" id="prods_total">R$ 0</span>
                        <span class="fs-5" id="prods_percent">0%</span>
                    </div>
                    <div class="d-flex flex-column flex-grow-1 p-4 rounded-4 border">
                        <span class="">Venda de Ordens</span>
                        <span class="fs-1 fw-bold" id="os_total">R$ 0</span>
                        <span class="fs-5" id="os_percent">0%</span>
                    </div>
                </div>
                <div class="d-flex flex-row align-items-start justify-content-around flex-grow-1 p-4 gap-4 rounded-4 border"
                    id="mini_report" style="min-height: 300px;">
                    <span id="spin_ldg" class="spinner-border spinner-border-sm text-light" role="status"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="../assets/js/services/pos_service.js"></script>
    <script type="module" src="../assets/js/utils/card_carrousel.js"></script>
    <!-- END SCRIPTS -->
</body>

</html>
