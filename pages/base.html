<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubbix Manager</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" href="../assets/img/fav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../assets/css/utils.css">
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/base.css">
</head>

<body data-bs-theme="dark">
    <!-- Adornos -->
    <!-- <div class="flex-adorno mobile-hide" id="adorno" hidden>
        <img src="../assets/img/gorro.svg" alt="adorno" class="adorno">
    </div> -->

    <!-- Main Section -->
    <section class="d-flex flex-column h-100">
        <!-- Options Desktop -->
        <div class="d-flex flex-row flex-wrap justify-content-between overflow-hidden mobile-hide nv"
            style="min-width: 180px;">
            <div class="d-flex gap-2 p-1 flex-row align-items-center justify-content-start flex-grow-1 flex-basis">
                <a onclick="change_screen('init_reports')" style="cursor: pointer;"><img data-name="brand" class="logo img-fluid object-fit-contain placeholder"></a>
                <div class="vr"></div>
                <span class="rounded-pill placeholder neon-text fs-6" data-name="store" style="max-width: 200px;">[STORE NAME]</span>
            </div>
            <div class="d-flex gap-2 fs-5 align-items-center justify-content-center flex-grow-1 flex-basis">
                <div class="newNav">
                    <button onclick="change_screen('pos', this)"
                        class="btnNewNav active menu-item menu-pos">Caixa</button>
                    <button onclick="change_screen('sales', this)"
                        class="btnNewNav menu-item menu-sales">Vendas</button>
                    <button onclick="change_screen('orders', this)"
                        class="btnNewNav menu-item menu-orders">Ordens</button>
                    <button onclick="change_screen('clients', this)"
                        class="btnNewNav menu-item menu-clients">Clientes</button>
                    <button onclick="change_screen('products', this)"
                        class="btnNewNav menu-item menu-prods">Estoque</button>
                    <button onclick="change_screen('parts', this)" class="btnNewNav menu-item menu-parts">Peças</button>
                    <button onclick="change_screen('reports', this)"
                        class="btnNewNav menu-item menu-reports">Relatórios</button>
                    <button onclick="change_screen('suport', this)"
                        class="btnNewNav menu-item menu-sup">Suporte</button>
                </div>
                <div class="newNav text-truncate">
                    <button onclick="change_screen('config/config', this)" class="btnNewNav menu-item menu-config"><i
                            class="bi bi-gear-fill"></i> Configurações</button>
                </div>
                <button onclick="logout()" class="btnNewNav btn-outline-red">Sair</button>
            </div>
        </div>

        <!-- Frame e Marquee -->
        <div class="d-flex flex-column h-100">
            <marquee style="margin-top: 10px;" class="d-flex gap-4" loop direction="left" id="mq"></marquee>
            <iframe class="p-2" src="../pages/init_reports.html" id="frame_screen" width="100%" height="100%"
                frameborder="0"></iframe>
        </div>
    </section>

    <!-- Options Mobile -->
    <div class="navBot mobile">
        <div class="d-flex mt-1 flex-row justify-content-around g-4">
            <a class="d-flex flex-column p-1 align-items-center navBot-item menu-caixa"
                onclick="change_screen('caixa')">
                <i class="bi bi-box-seam-fill"></i>
                <p>Caixa</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item menu-vendas"
                onclick="change_screen('vendas')">
                <i class="bi bi-graph-up-arrow"></i>
                <p>Vendas</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item menu-os" onclick="change_screen('os')">
                <i class="bi bi-file-earmark-zip-fill"></i>
                <p>Ordens</p>
            </a>
            <a class="d-flex flex-column p-1 align-items-center navBot-item" role="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <i class="bi bi-list"></i>
                <p>Demais</p>
            </a>
            <ul class="dropdown-menu text-bg-dark">
                <li><button onclick="change_screen('clientes')" class="dropdown-item dp-item menu-clientes"><i
                            class="bi bi-person-bounding-box"></i> Clientes</a></li>
                <li><button onclick="change_screen('estoque')" class="dropdown-item dp-item menu-estoque"><i
                            class="bi bi-archive-fill"></i> Estoque</a></li>
                <li><button onclick="change_screen('pecas')" class="dropdown-item dp-item menu-pecas"><i
                            class="bi bi-gear-fill"></i> Peças</a></li>
                <li><button onclick="change_screen('relatorios')" id="btnMrelatorios"
                        class="dropdown-item dp-item menu-relatorios"><i class="bi bi-microsoft"></i> Relatórios</a>
                </li>
                <hr>
                <li><button onclick="change_screen('config')"
                        class="dropdown-item dp-item menu-config">Configurações</a></li>
                <li><button class="dropdown-item dp-item-exit" onclick="logout()">Sair</button></li>
            </ul>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> <!-- Jquery -->
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script> <!-- InputMask-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- CHARTJS -->
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script> <!-- GRID JS-->
</body>

</html>
