<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubbix Manager</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Favicon -->
    <link rel="icon" href="../assets/img/fav.png">

    <!-- Local Arch -->
    <link rel="stylesheet" href="../assets/css/utils.css">
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/base.css">
</head>

<body data-bs-theme="dark">
    <!--=============================================================================================
    =================================================================================================
    =========================== DEV BY GUILHERME BREVE  =============================================
    =================================================================================================
    ==============================================================================================-->
    
    <!-- Adornos -->
    <!-- <div class="flex-adorno mobile-hide" id="adorno" hidden>
        <img src="../assets/img/gorro.svg" alt="adorno" class="adorno">
    </div> -->

    <!-- Main Section -->
    <section class="d-flex flex-column h-100">
        <!-- Options Desktop -->
        <div class="d-flex flex-row flex-wrap justify-content-between overflow-hidden mobile-hide nv"
            style="min-width: 180px;">
            <div class="d-flex gap-2 p-1 flex-row align-items-center justify-content-start flex-grow-1 flex-basis">
                <a style="cursor: pointer;" data-change-screen="init_reports"><img data-name="brand" class="logo img-fluid object-fit-contain placeholder"></a>
                <div class="vr"></div>
                <span class="rounded-pill placeholder neon-text fs-6" data-name="store" style="max-width: 200px;">[STORE NAME]</span>
            </div>
            <div class="d-flex gap-2 fs-5 align-items-center justify-content-center flex-grow-1 flex-basis">
                <div class="newNav">
                    <button data-change-screen="pos" class="btnNewNav">Caixa</button>
                    <button data-change-screen="sales" class="btnNewNav">Vendas</button>
                    <button data-change-screen="orders" class="btnNewNav">Ordens</button>
                    <button data-change-screen="clients" class="btnNewNav">Clientes</button>
                    <button data-change-screen="products" class="btnNewNav">Estoque</button>
                    <button data-change-screen="parts" class="btnNewNav">Peças</button>
                    <button data-change-screen="reports" class="btnNewNav">Relatórios</button>
                    <button data-change-screen="suport" class="btnNewNav">Suporte</button>
                </div>
                <div class="newNav text-truncate">
                    <button data-change-screen="config" class="btnNewNav"><i
                            class="bi bi-gear-fill"></i> Configurações</button>
                </div>
                <button data-btn="logout" class="btnNewNav btn-outline-red">Sair</button>
            </div>
        </div>

        <!-- Frame e Marquee -->
        <div class="d-flex flex-column h-100">
            <marquee style="margin-top: 10px;" class="d-flex gap-4" loop direction="left" id="mq"></marquee>
            <iframe class="p-2" src="../pages/init_reports.html" id="frame_screen" width="100%" height="100%"
                frameborder="0"></iframe>
        </div>
    </section>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> <!-- Jquery -->
    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.9/dist/jquery.inputmask.min.js"></script> <!-- InputMask-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- CHARTJS -->
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script> <!-- GRID JS-->
</body>

</html>
